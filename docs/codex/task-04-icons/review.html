<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Значки папок Flux — варианты</title>
  <style>
    :root { color-scheme: light; --window: #fff; --panel: #f8faf9; --line: #dce4df; --text: #27332d; --muted: #65736b; --soft: #f1f5f2; --accent: #147d48; }
    :root.dark { color-scheme: dark; --window: #171d19; --panel: #202823; --line: #36423a; --text: #e5ece7; --muted: #a2afa6; --soft: #29332c; --accent: #70d39b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--window); color: var(--text); font: 13px/20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 920px); margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
    .theme { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--window); color: var(--text); font: inherit; cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 9px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .mark { display: inline-grid; width: 16px; height: 16px; place-items: center; border-radius: 50%; font-size: 10px; font-weight: 600; }
    .mark.flux { color: #fff; background: #16834a; }
    .mark.share { border: 1px solid #77877d; color: var(--text); background: var(--window); }
    .mark.share svg { width: 11px; height: 11px; fill: currentColor; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    article { min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--window); }
    h2 { margin: 0; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; line-height: 20px; font-weight: 600; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; }
    .sample { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 96px; padding: 8px 4px; background: #fff; }
    .sample + .sample { border-left: 1px solid var(--line); }
    .sample.dark-sample { background: #171d19; }
    .sample img { width: 56px; height: 56px; }
    .sample small { color: #65736b; font-size: 12px; line-height: 16px; }
    .sample.dark-sample small { color: #a2afa6; }
    footer { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 16px; }
    .dark-mode-only { display: none; }
    :root.dark .light-mode-only { display: none; }
    :root.dark .dark-mode-only { display: inline; }
    :root.dark .sample.dark-sample { background: #171d19; }
    @media (max-width: 680px) { main { padding: 16px; } .grid { grid-template-columns: 1fr; } .sample { min-height: 88px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Значки папок</h1>
      <button class="theme" type="button" aria-label="Переключить тему"><span class="light-mode-only">Тёмная тема</span><span class="dark-mode-only">Светлая тема</span></button>
    </header>
    <div class="legend" aria-label="Значение меток">
      <span><b class="mark flux">F</b> Только в Flux</span>
      <span><b class="mark share"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="4" cy="3.2" r="1.5"/><circle cx="8.2" cy="3.2" r="1.5"/><path d="M1.4 10c.1-2.5 1-3.8 2.6-3.8S6.5 7.5 6.6 10H1.4Zm4.2 0c.1-2.5 1-3.8 2.6-3.8s2.5 1.3 2.6 3.8H5.6Z"/></svg></b> Общий доступ</span>
      <span>Метки стоят в разных углах и могут использоваться вместе</span>
    </div>
    <section class="grid" aria-label="Три варианта папки">
      <article>
        <h2>Шкаф</h2>
        <div class="pair">
          <div class="sample"><img src="variant-01-cabinet.svg" alt=""><small>Светлая</small></div>
          <div class="sample dark-sample"><img src="variant-01-cabinet.svg" alt=""><small>Тёмная</small></div>
        </div>
      </article>
      <article>
        <h2>Слои</h2>
        <div class="pair">
          <div class="sample"><img src="variant-02-folders.svg" alt=""><small>Светлая</small></div>
          <div class="sample dark-sample"><img src="variant-02-folders.svg" alt=""><small>Тёмная</small></div>
        </div>
      </article>
      <article>
        <h2>Лаконичный</h2>
        <div class="pair">
          <div class="sample"><img src="variant-03-minimal.svg" alt=""><small>Светлая</small></div>
          <div class="sample dark-sample"><img src="variant-03-minimal.svg" alt=""><small>Тёмная</small></div>
        </div>
      </article>
    </section>
    <footer>Форма папки остаётся знакомой и не похожа на диск; зелёная метка F означает виртуальный объект Flux, две фигуры — общий доступ.</footer>
  </main>
  <script>
    document.querySelector('.theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'));
  </script>
</body>
</html>
