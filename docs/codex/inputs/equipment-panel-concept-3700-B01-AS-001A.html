<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flux — Оборудование (3700-B01-AS-001A)</title>
  <style>
    :root {
      --flux-surface: #ffffff;
      --flux-bg: #f8fafc;
      --flux-panel: #f1f5f9;
      --flux-line: #e2e8f0;
      --flux-line-subtle: #f1f5f9;
      --flux-text: #1e293b;
      --flux-text-secondary: #475569;
      --flux-text-muted: #94a3b8;
      --flux-accent: #059669;
      --flux-accent-hover: #047857;
      --flux-accent-soft: rgba(5, 150, 105, 0.08);
      --flux-accent-border: rgba(5, 150, 105, 0.32);
      --flux-amber-bg: #fffbeb;
      --flux-amber-border: #fde68a;
      --flux-amber-text: #92400e;
      --flux-sky-bg: #f0f9ff;
      --flux-sky-border: #bae6fd;
      --flux-sky: #0284c7;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html.dark {
      --flux-surface: #0b111e;
      --flux-bg: #0f172a;
      --flux-panel: #1e293b;
      --flux-line: #1e293b;
      --flux-line-subtle: #152033;
      --flux-text: #f1f5f9;
      --flux-text-secondary: #cbd5e1;
      --flux-text-muted: #64748b;
      --flux-accent: #10b981;
      --flux-accent-hover: #34d399;
      --flux-accent-soft: rgba(16, 185, 129, 0.12);
      --flux-accent-border: rgba(16, 185, 129, 0.38);
      --flux-amber-bg: rgba(120, 53, 15, 0.22);
      --flux-amber-border: rgba(217, 119, 6, 0.35);
      --flux-amber-text: #fcd34d;
      --flux-sky-bg: rgba(12, 74, 110, 0.25);
      --flux-sky-border: rgba(56, 189, 248, 0.35);
      --flux-sky: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 19px;
      color: var(--flux-text);
      background: var(--flux-surface);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; color: inherit; }
    .font-mono { font-family: var(--font-mono); }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* ── Макет экрана «Оборудование» ── */
    .fx-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .fx-head {
      height: 42px;
      min-height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .fx-head-left { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .fx-head-title { font-size: 15px; font-weight: 600; }
    .fx-head-count { font-size: 13px; color: var(--flux-text-muted); }
    .fx-head-acts { display: flex; align-items: center; gap: 6px; }

    .fx-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      color: var(--flux-text);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }
    .fx-btn:hover { background: var(--flux-bg); border-color: var(--flux-text-muted); }
    .fx-btn-sm { height: 24px; padding: 0 8px; font-size: 11px; }
    .fx-btn-ghost { border-color: transparent; background: transparent; color: var(--flux-text-secondary); }
    .fx-btn-ghost:hover { background: var(--flux-panel); color: var(--flux-text); }
    .fx-btn-primary { background: var(--flux-accent); border-color: var(--flux-accent); color: #ffffff; }
    .fx-btn-primary:hover { background: var(--flux-accent-hover); border-color: var(--flux-accent-hover); }
    .fx-ibtn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--flux-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .fx-ibtn:hover { background: var(--flux-panel); color: var(--flux-text); }
    .fx-ibtn.is-on { color: var(--flux-accent); background: var(--flux-accent-soft); }

    /* Трёхколоночная сетка */
    .fx-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 184px 268px minmax(0, 1fr);
    }

    /* 1. Колонка категорий */
    .fx-side {
      border-right: 1px solid var(--flux-line);
      background: var(--flux-bg);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .fx-gh {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--flux-text-muted);
      padding: 6px 8px 4px;
    }
    .fx-li {
      width: 100%;
      height: 30px;
      padding: 0 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      color: var(--flux-text-secondary);
      cursor: pointer;
      text-align: left;
    }
    .fx-li:hover { background: var(--flux-panel); color: var(--flux-text); }
    .fx-li[aria-current="true"] {
      background: var(--flux-accent-soft);
      color: var(--flux-accent);
      font-weight: 600;
    }
    .fx-n { font-size: 11px; color: var(--flux-text-muted); font-variant-numeric: tabular-nums; }

    /* 2. Колонка дерева позиций */
    .tree-col {
      border-right: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tree-head {
      height: 36px;
      padding: 0 10px;
      border-bottom: 1px solid var(--flux-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .tree-subhead {
      padding: 6px 10px;
      border-bottom: 1px solid var(--flux-line-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .fx-segctl {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 6px;
      background: var(--flux-panel);
      border: 1px solid var(--flux-line);
      gap: 2px;
    }
    .fx-segctl button {
      height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 500;
      color: var(--flux-text-secondary);
      cursor: pointer;
    }
    .fx-segctl button[aria-pressed="true"] {
      background: var(--flux-surface);
      color: var(--flux-text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .tree-unit-row, .tree-mono-row { margin-bottom: 2px; }
    .tree-btn {
      width: 100%;
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: left;
    }
    .tree-btn:hover { background: var(--flux-bg); }
    .tree-btn.is-active { background: var(--flux-accent-soft); color: var(--flux-accent); }
    .tree-item {
      width: 100%;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 1px;
    }
    .tree-item:hover { background: var(--flux-bg); }
    .tree-item.is-active {
      background: var(--flux-accent-soft);
      outline: 1px solid var(--flux-accent-border);
    }
    .tree-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--flux-accent);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .tree-item-title {
      display: block;
      font-size: 12px;
      line-height: 15px;
      font-weight: 500;
      color: var(--flux-text);
    }
    .tree-item-sub {
      display: block;
      font-size: 11px;
      line-height: 14px;
      color: var(--flux-text-muted);
      margin-top: 1px;
    }
    .tree-tag { font-family: var(--font-mono); color: var(--flux-accent); font-weight: 500; }

    /* ── 3. Правая панель ── */
    .right-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      background: var(--flux-bg);
      display: flex;
      flex-direction: column;
    }

    /* Бейджи и теги */
    .fx-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--flux-panel);
      color: var(--flux-text-secondary);
      border: 1px solid var(--flux-line);
      white-space: nowrap;
    }
    .fx-badge-accent {
      background: var(--flux-accent-soft);
      color: var(--flux-accent);
      border-color: var(--flux-accent-border);
    }
    .fx-badge-sky {
      background: var(--flux-sky-bg);
      color: var(--flux-sky);
      border-color: var(--flux-sky-border);
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      background: var(--flux-accent-soft);
      color: var(--flux-accent);
      border: 1px solid var(--flux-accent-border);
      white-space: nowrap;
    }
    .tag-add-btn {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px dashed var(--flux-line);
      background: transparent;
      font-size: 11px;
      color: var(--flux-text-muted);
      cursor: pointer;
    }
    .tag-add-btn:hover { border-color: var(--flux-accent); color: var(--flux-accent); }

    /* ============================================================================
       СОСТОЯНИЕ 1: БОЛЬШАЯ СХЕМА УСТАНОВКИ (только наименование, марка, тег и
       дочерние элементы с их наименованием, маркой и тегом — без лишних цифр)
       ============================================================================ */
    .unit-top-bar {
      padding: 12px 16px;
      background: var(--flux-surface);
      border-bottom: 1px solid var(--flux-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .unit-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .unit-kind {
      font-size: 12px;
      font-weight: 600;
      color: var(--flux-text-secondary);
    }
    .unit-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--flux-text);
    }
    .unit-model-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--flux-sky-bg);
      border: 1px solid var(--flux-sky-border);
      color: var(--flux-sky);
    }

    /* Секция большой схемы установки */
    .ahu-schematic-section {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ahu-monoblocks-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ahu-mono-frame {
      border-radius: 10px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ahu-mono-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--flux-line-subtle);
    }
    .ahu-mono-btn {
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--flux-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ahu-mono-btn:hover { color: var(--flux-accent); }

    .ahu-mono-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
      align-items: start;
    }

    /* Карточка блока на большой схеме: только Наименование, Марка, Тег и Дочерние элементы */
    .ahu-block-card {
      border-radius: 8px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      flex-direction: column;
      transition: border-color 120ms, box-shadow 120ms;
      overflow: hidden;
    }
    .ahu-block-card:hover {
      border-color: var(--flux-accent);
      box-shadow: 0 3px 12px rgba(5, 150, 105, 0.08);
    }

    .ahu-block-head {
      padding: 10px 12px;
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .ahu-block-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .ahu-block-pos {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--flux-text);
    }
    .ahu-block-icon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: var(--flux-accent-soft);
      color: var(--flux-accent);
      border: 1px solid var(--flux-accent-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .ahu-block-name {
      font-size: 13px;
      line-height: 17px;
      font-weight: 600;
      color: var(--flux-text);
    }
    .ahu-block-head:hover .ahu-block-name { color: var(--flux-accent); }

    .ahu-block-model {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 15px;
      color: var(--flux-sky);
      background: var(--flux-sky-bg);
      border: 1px solid var(--flux-sky-border);
      padding: 2px 6px;
      border-radius: 4px;
      word-break: break-all;
      align-self: flex-start;
    }

    /* Дочерние элементы внутри блока: Наименование + Марка + Дочерний тег */
    .ahu-block-children {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--flux-line);
      background: var(--flux-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ahu-child-card {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
      cursor: pointer;
      transition: border-color 120ms;
    }
    .ahu-child-card:hover {
      border-color: var(--flux-accent);
    }
    .ahu-child-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .ahu-child-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--flux-text);
    }
    .ahu-child-card:hover .ahu-child-name { color: var(--flux-accent); }
    .ahu-child-model {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 14px;
      color: var(--flux-text-secondary);
      word-break: break-all;
    }

    /* ============================================================================
       СОСТОЯНИЕ 2: СЖАТАЯ СХЕМА УСТАНОВКИ В ВЕРХНЕЙ ПАНЕЛИ (когда выбран блок)
       ============================================================================ */
    .compact-unit-dock {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--flux-surface);
      border-bottom: 1px solid var(--flux-line);
      padding: 7px 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .compact-dock-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .compact-unit-home {
      height: 28px;
      padding: 0 9px;
      border-radius: 6px;
      border: 1px solid var(--flux-line);
      background: var(--flux-bg);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--flux-text);
      cursor: pointer;
    }
    .compact-unit-home:hover { border-color: var(--flux-accent); color: var(--flux-accent); }

    .compact-mono-box {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px;
      border-radius: 7px;
      background: var(--flux-bg);
      border: 1px solid var(--flux-line);
    }
    .compact-mono-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--flux-text-muted);
      padding: 0 5px;
    }

    .compact-block-tile {
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: var(--flux-surface);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 11px;
      transition: all 120ms;
    }
    .compact-block-tile:hover { border-color: var(--flux-accent-border); color: var(--flux-accent); }
    .compact-block-tile.is-active {
      background: var(--flux-accent);
      border-color: var(--flux-accent);
      color: #ffffff;
    }
    .compact-block-tile .c-pos { font-family: var(--font-mono); font-weight: 700; }
    .compact-block-tile .c-name { font-weight: 500; }

    /* Полоска переключения элементов внутри активного блока */
    .compact-subitems-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px solid var(--flux-line-subtle);
      font-size: 11px;
    }
    .compact-subitem-pill {
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid var(--flux-line);
      background: var(--flux-bg);
      font-size: 11px;
      color: var(--flux-text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .compact-subitem-pill:hover { border-color: var(--flux-accent); color: var(--flux-text); }
    .compact-subitem-pill.is-selected {
      background: var(--flux-accent-soft);
      border-color: var(--flux-accent);
      color: var(--flux-accent);
      font-weight: 600;
    }

    /* ============================================================================
       ШАПКА ВЫБРАННОГО БЛОКА + СТРОКА И ПАНЕЛЬ КАТАЛОГА
       ============================================================================ */
    .block-header-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .catalog-bar-inline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--flux-bg);
      border: 1px solid var(--flux-line);
    }
    .catalog-select {
      height: 24px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--flux-text);
      outline: none;
    }
    .catalog-drawer {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .catalog-matches-list {
      border: 1px solid var(--flux-line);
      border-radius: 6px;
      overflow: hidden;
    }
    .catalog-match-row {
      width: 100%;
      padding: 6px 10px;
      border-bottom: 1px solid var(--flux-line-subtle);
      background: var(--flux-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .catalog-match-row:last-child { border-bottom: none; }
    .catalog-match-row.is-chosen { background: var(--flux-accent-soft); }

    .catalog-diff-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      border: 1px solid var(--flux-line);
      border-radius: 6px;
      overflow: hidden;
    }
    .catalog-diff-table th {
      text-align: left;
      padding: 5px 8px;
      background: var(--flux-bg);
      border-bottom: 1px solid var(--flux-line);
      color: var(--flux-text-muted);

      border-bottom: 1px solid var(--flux-line-subtle);

    .rp-content {
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .specs-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      width: 260px;
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-box:focus-within { border-color: var(--flux-accent); }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
    }

    .groups-masonry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .group-card {
      border-radius: 8px;
      border: 1px solid var(--flux-line);
      background: var(--flux-surface);
      overflow: hidden;
    }

    .group-card-head {
      padding: 6px 10px;
      background: var(--flux-panel);
      border-bottom: 1px solid var(--flux-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--flux-text);
    }

    .group-rows {
      display: flex;
      flex-direction: column;
    }
    .kv-row {
      padding: 4.5px 10px;
      border-bottom: 1px solid var(--flux-line-subtle);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }
    .kv-row:last-child { border-bottom: none; }
    .kv-row:hover { background: var(--flux-bg); }
    .kv-key {
      color: var(--flux-text-secondary);
      min-width: 0;
    }
    .kv-val-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-align: right;
      flex-shrink: 0;
      max-width: 62%;
    }
    .kv-val {
      font-weight: 600;
      color: var(--flux-text);
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .kv-val.is-overridden { color: #d97706; }
    .kv-val.is-catalog { color: var(--flux-sky); }
    .kv-unit {
      color: var(--flux-text-muted);
      font-weight: 400;
      margin-left: 2px;
    }

    .notes-line {
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--flux-amber-bg);
      border: 1px solid var(--flux-amber-border);
      color: var(--flux-amber-text);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    function allComponents() {
      const out = [];
      for (const mb of UNIT.monoblocks) {
        for (const c of mb.components) out.push({ ...c, monoId: mb.id, monoName: mb.name });
      }
      return out;
    }

    function compById(id) {
      return allComponents().find(c => c.id === id) || null;
    }

    // Разделение склеенного заголовка на чистое Наименование и Марку (модель)
    function splitNameAndModel(c) {
      if (!c) return { name: '', model: '' };
      if (c.itemCode === '__unit__') return { name: 'Приточная установка', model: UNIT.title };
      if (String(c.itemCode || '').endsWith('_общие')) return { name: 'Общие параметры моноблока', model: '' };

      const rawTitle = String(c.name || '').trim();
      const m = rawTitle.match(/^(Клапан|Электропривод|Теплообменник|Узел регулирующий|Бак|Вентилятор|Электродвигатель|Выключатель светильника|Сервисный выключатель|Питометражное подключение)\s+(.+?)(?:\s+(№\d+))?$/i);
      if (m) {
        const cleanName = m[1] + (m[3] ? ' ' + m[3] : '');
        const cleanModel = m[2].trim();
        return { name: cleanName, model: cleanModel };
      }

      // Для корневых секций (1.1, 1.2, 2.1, 2.2, 2.3, 3, 4)
      const groups = (c?.specs?.groups) || [];
      const all = groups.flatMap(g => g.params || []);
      const modelKeys = [
        /^Кассета 1$/i,
        /^Теплообменник$/i,
        /^Вентилятор$/i,
        /^Клапан$/i,
        /^Узел обвязки$/i,
        /^Электродвигатель$/i,
        /^Электропривод$/i
      ];
      for (const re of modelKeys) {
        const hit = all.find(p => re.test(p.key) && String(p.value ?? '').trim() && String(p.value).trim() !== '-');
        if (hit) {
          return { name: rawTitle, model: String(hit.value).trim() };
        }
      }
      return { name: rawTitle, model: '' };
    }

    function blockLabel(c) {
      return splitNameAndModel(c).name;
    }

    function shortBlockName(c) {
      return blockLabel(c)
        .replace(/^Блок воздухоприемный.*/i, 'Воздухоприёмный')
        .replace(/^Воздухонагреватель жидкостный/i, 'Нагреватель')
        .replace(/^Воздухоохладитель.*/i, 'Охладитель')
        .replace(/^Фильтр карманный/i, 'Фильтр')
        .replace(/^Камера промежуточная/i, 'Камера')
        .replace(/^Вентилятор.*/i, 'Вентилятор');
    }

    function firstTag(c) {
      return (c?.tags && c.tags[0] && c.tags[0].identifier) || '';
    }

    function parseBlockPosition(code) {
      const raw = String(code || '').trim().replace(/^бл(?:ок)?\s*/i, '');
      if (!/^\d+(?:\.\d+)*$/.test(raw)) return null;
      return raw.split('.').map(Number);
    }

    function compareBlockPositions(a, b) {
      const len = Math.max(a.length, b.length);
      for (let i = 0; i < len; i++) {
        const av = a[i] ?? 0;
        const bv = b[i] ?? 0;
        if (av !== bv) return av - bv;
      }
      return 0;
    }

    function sectionIcon(c) {
      const t = String(c?.equipType || c?.role || '').toUpperCase();
      const name = String(c?.name || '').toLowerCase();
      if (t.includes('ФИЛЬТР') || name.includes('фильтр')) return '▤';
      if (t.includes('НАГРЕВАТЕЛЬ') || name.includes('нагреватель')) return '☀';
      if (t.includes('ОХЛАДИТЕЛЬ') || name.includes('охладитель')) return '❄';
      if (t.includes('ВЕНТИЛЯТОР') || name.includes('вентилятор')) return '◎';
      if (t.includes('КАМЕРА') || name.includes('камера')) return '▭';
      return '⇕';
    }

    const HIDDEN_NOISE_KEYS = /^(тип блока|позиция|ярус|наименование|состав установки|задача расчёта|подпись|факс|ptract|ptcoilsgeom|ptcoilsnono|ptcoilsadjustfactor|ptlfr|ptx1|ptx2|ptdthe|ptdtcc|ptdte|pttanktrap)$/i;

    function cleanParams(params) {
      if (state.showAllParams) return params || [];
      return (params || []).filter(p => {
        const val = String(p.value ?? '').trim();
        if (!val || val === '-' || /^_+$/.test(val)) return false;
        if (HIDDEN_NOISE_KEYS.test(p.key)) return false;
        return true;
      });
    }

      const { name, model } = splitNameAndModel(c);
      const modelCode = model || name;
      const groups = c.specs?.groups || [];
      const firstGroup = groups[0]?.title || 'Блок';
      return {

          { id: 'cat-2', code: modelCode + ' (исп. КЕДР)', title: name + ' · морозостойкое исп.' }

          { group: firstGroup, key: 'Срок службы', xmlVal: '—', catVal: '10 лет' }

    }

    function prioritizeBlockGroups(groups) {
      return [...(groups || [])]
        .filter(g => state.showAllParams || !/^(состав|примечания)$/i.test(g.title))
        .map((g, idx) => ({ g, idx, prio: BLOCK_GROUP_PRIORITY[g.title] ?? (120 + idx) }))
        .sort((a, b) => a.prio - b.prio || a.idx - b.idx)
        .map(x => x.g);
    }

    function extractSectionNotes(specsObj) {
      const groups = (specsObj && specsObj.groups) || [];
      const out = [];
      for (const g of groups) {
        if (!/примечан|особые условия/i.test(g.title)) continue;
        for (const p of g.params || []) {
          const raw = String(p.value ?? '').trim();
          if (!raw) continue;
          const parts = raw.includes('"')
            ? [...raw.matchAll(/"([^"]+)"/g)].map(m => m[1].trim())
            : raw.split(/[\r\n;]+/).map(s => s.trim());
          for (const phrase of parts) {
            if (!phrase || /^таг-?номер(?:\s|$|:)/i.test(phrase)) continue;
            if (/^негабаритный груз$/i.test(p.key) && phrase === 'да') continue;
            if (!out.includes(phrase)) out.push(phrase);
          }
        }
      }
      return out;
    }

    function buildSchematicTree() {
      const comps = allComponents().filter(c => c.itemCode !== '__unit__' && !String(c.itemCode).endsWith('_общие'));
      const byId = new Map(comps.map(c => [c.id, c]));
      const children = new Map();
      const roots = [];
      for (const c of comps) {
        if (!c.parentElementId) roots.push(c);
        else if (byId.has(c.parentElementId)) {
          if (!children.has(c.parentElementId)) children.set(c.parentElementId, []);
          children.get(c.parentElementId).push(c);
        }
      }
      const collectAllDescendants = (parentId, depth = 1) => {
        const list = [];
        for (const ch of (children.get(parentId) || [])) {
          list.push({ item: ch, depth });
          list.push(...collectAllDescendants(ch.id, depth + 1));
        }
        return list;
      };
      const sortedRoots = roots
        .map((item, idx) => ({ item, idx, pos: parseBlockPosition(item.itemCode) }))
        .sort((a, b) => {
          if (a.pos && b.pos) return compareBlockPositions(a.pos, b.pos);
          return a.idx - b.idx;
        })
        .map(x => ({
          item: x.item,
          descendants: collectAllDescendants(x.item.id, 1)
        }));
      return { roots: sortedRoots, physicalCount: comps.length };
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

      document.getElementById('treeModeComp').setAttribute('aria-pressed', String(mode === 'composition'));

      state.expandedMonos[mbId] = !state.expandedMonos[mbId];
      renderTree();
    }

      state.selectedBlockId = null;
      renderTree();
      renderRightPanel();
    }

    function openBlock(compId) {
      const c = compById(compId);
      if (!c) return;
      state.selectedBlockId = compId;
      state.blockSearch = '';
      state.editingToken = null;
      if (c.monoId) state.expandedMonos[c.monoId] = true;
      renderTree();
      renderRightPanel();
    }

      state.blockSearch = val;
      renderRightPanel();
      const input = document.getElementById('blockSearchInput');
      if (input) {
        input.focus();

      for (const mb of UNIT.monoblocks) {
        const target = mb.components.find(x => x.id === compId);
        if (target) {
          let g = (target.specs?.groups || []).find(x => x.title === groupTitle);
          if (!g) {
            g = { title: groupTitle, params: [] };
            target.specs.groups.push(g);
          }
          let p = (g.params || []).find(x => x.key === key);
          if (p) p.value = newVal;
          else g.params.push({ key, value: newVal, unit: '' });
        }
      }
      state.catalogAccepted[`${compId}||${groupTitle}||${key}`] = true;
      renderRightPanel();
    }

    function startEditParam(token, currentVal) {
      state.editingToken = token;
      renderRightPanel();
      const inp = document.getElementById('editParamInput');
      if (inp) { inp.value = currentVal; inp.focus(); inp.select(); }
    }

    function saveEditParam(compId, groupTitle, key) {
      const inp = document.getElementById('editParamInput');
      if (!inp) return;
      const val = inp.value.trim();
      const c = compById(compId);
      if (c) {
        for (const mb of UNIT.monoblocks) {
          const target = mb.components.find(x => x.id === compId);
          if (target) {
            const g = (target.specs?.groups || []).find(x => x.title === groupTitle);
            const p = (g?.params || []).find(x => x.key === key);
            if (p) p.value = val;
          }
        }
        state.overrides[`${compId}||${groupTitle}||${key}`] = val;
      }
      state.editingToken = null;
      renderRightPanel();
    }

    // ── Рендер левого дерева ──
    function renderTree() {
      const container = document.getElementById('treeContainer');
      const comps = allComponents();

      if (state.treeMode === 'type') {
        const byRole = new Map();
        for (const c of comps) {
          const r = c.itemCode === '__unit__' ? 'УСТАНОВКА' : c.role || 'ПРОЧЕЕ';
          if (!byRole.has(r)) byRole.set(r, []);
          byRole.get(r).push(c);
        }
        let html = '';
        for (const [role, rows] of byRole.entries()) {
          html += `<div class="fx-gh">${esc(role)} <span class="tabular-nums">· ${rows.length}</span></div>`;
          for (const c of rows) {
            const active = state.selectedBlockId === c.id ? 'is-active' : '';
            const tag = firstTag(c);
            const isBlock = c.role === 'БЛОК' && parseBlockPosition(c.itemCode);
            const { name, model } = splitNameAndModel(c);
            const sub = [tag ? `<span class="tree-tag">${esc(tag)}</span>` : '', model ? esc(model) : '', isBlock ? `Блок ${esc(c.itemCode)}` : ''].filter(Boolean).join(' · ');
            html += `
              <button type="button" class="tree-item ${active}" onclick="openBlock('${c.id}')">
                <span class="tree-dot"></span>
                <span style="min-width:0;flex:1;">
                  <span class="tree-item-title">${esc(c.itemCode === '__unit__' ? UNIT.name : name)}</span>
                  ${sub ? `<span class="tree-item-sub">${sub}</span>` : ''}
                </span>
              </button>`;
          }
        }
        container.innerHTML = html;
        return;
      }

      const unitSelected = state.selectedBlockId === null ? 'is-active' : '';
      let html = `
        <div class="tree-unit-row">
          <button type="button" class="tree-btn ${unitSelected}" onclick="selectUnit()">
            <span style="color:var(--flux-accent);font-weight:600;">❖</span>
            <span style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(UNIT.name)}</span>
          </button>
        </div>
      `;

      for (const mb of UNIT.monoblocks) {
        const isUnitMb = mb.name === '__unit__';
        const isExp = isUnitMb || !!state.expandedMonos[mb.id];
        if (!isUnitMb) {
          html += `
            <div class="tree-mono-row" style="margin-left:10px;">
              <button type="button" class="tree-btn" onclick="toggleMono('${mb.id}')">
                <span style="color:var(--flux-text-muted);font-size:11px;">${isExp ? '▾' : '▸'}</span>
                <span style="font-size:12px;font-weight:600;color:var(--flux-text-secondary);">${esc(mb.name)}</span>
              </button>
            </div>
          `;
        }
        if (isExp) {
          const live = new Set(mb.components.map(c => c.id));
          const byParent = new Map();
          for (const c of mb.components) {
            const k = c.parentElementId && live.has(c.parentElementId) ? c.parentElementId : '';
            if (!byParent.has(k)) byParent.set(k, []);
            byParent.get(k).push(c);
          }
          const walk = (key, depth) => {
            const list = byParent.get(key) || [];
            for (const c of list) {
              const active = state.selectedBlockId === c.id ? 'is-active' : '';
              const pad = 20 + depth * 12;
              const tag = firstTag(c);
              const isBlock = c.role === 'БЛОК' && parseBlockPosition(c.itemCode);
              const { name } = splitNameAndModel(c);
              const subParts = [];
              if (tag) subParts.push(`<span class="tree-tag">${esc(tag)}</span>`);
              if (isBlock) subParts.push(`<span>Блок ${esc(c.itemCode)}</span>`);
              html += `
                <button type="button" class="tree-item ${active}" style="padding-left:${pad}px;" onclick="openBlock('${c.id}')">
                  <span class="tree-dot"></span>
                  <span style="min-width:0;flex:1;">
                    <span class="tree-item-title">${esc(name)}</span>
                    ${subParts.length ? `<span class="tree-item-sub">${subParts.join(' · ')}</span>` : ''}
                  </span>
                </button>
              `;
              walk(c.id, depth + 1);
            }
          };
          walk('', 0);
        }
      }
      container.innerHTML = html;
    }

    function renderRightPanel() {
      const rp = document.getElementById('rightPanel');
      if (state.selectedBlockId) {
        rp.innerHTML = renderBlockSelectedView(state.selectedBlockId);
      } else {
        rp.innerHTML = renderUnitOverviewView();
      }
    }

    // =========================================================================
    // СОСТОЯНИЕ 1: БОЛЬШАЯ СХЕМА УСТАНОВКИ
    // Без характеристик типа расхода воздуха и т.д. — только наименование,
    // марка, тег блока и дочерние элементы (их наименование, марка и тег)
    // =========================================================================
    function renderUnitOverviewView() {
      const comps = allComponents();
      const generalComp = comps.find(c => c.itemCode === '__unit__');
      const tree = buildSchematicTree();

      const monoBlocks = UNIT.monoblocks.filter(mb => mb.name !== '__unit__').map(mb => {
        const gen = mb.components.find(c => String(c.itemCode).endsWith('_общие'));
        const sections = tree.roots.filter(r => r.item.monoId === mb.id);
        return { id: mb.id, name: mb.name, genId: gen?.id, sections };
      });

      const renderFullBlockCard = (node) => {
        const c = node.item;
        const tag = firstTag(c);
        const { name, model } = splitNameAndModel(c);
        const kids = node.descendants || [];

        return `
          <div class="ahu-block-card">
            <button type="button" class="ahu-block-head" onclick="openBlock('${c.id}')">
              <div class="ahu-block-top-row">
                <span class="ahu-block-pos">
                  <span class="ahu-block-icon">${sectionIcon(c)}</span>
                  <span>Блок ${esc(c.itemCode)}</span>
                </span>
                ${tag ? `<span class="tag-chip">${esc(tag)}</span>` : ''}
              </div>
              <div class="ahu-block-name">${esc(name)}</div>
              ${model ? `<div class="ahu-block-model">${esc(model)}</div>` : ''}
            </button>

            ${kids.length > 0 ? `
              <div class="ahu-block-children">
                ${kids.map(({ item: ch, depth }) => {
                  const chTag = firstTag(ch);
                  const chInfo = splitNameAndModel(ch);
                  return `
                    <button
                      type="button"
                      class="ahu-child-card"
                      style="margin-left:${(depth - 1) * 12}px;width:calc(100% - ${(depth - 1) * 12}px);"
                      onclick="openBlock('${ch.id}')"
                    >
                      <div class="ahu-child-top">
                        <span class="ahu-child-name">${depth > 1 ? '└ ' : ''}${esc(chInfo.name)}</span>
                        ${chTag ? `<span class="tag-chip" style="font-size:10.5px;padding:0 6px;">${esc(chTag)}</span>` : ''}
                      </div>
                      ${chInfo.model ? `<div class="ahu-child-model">${esc(chInfo.model)}</div>` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      };

      return `
        <!-- Шапка установки: только Наименование, Марка и Тег + кнопка открытия параметров самой установки -->
        <div class="unit-top-bar">
          <div class="unit-identity">
            <span class="unit-kind">Приточная установка</span>
            <h2 class="unit-title">❖ ${esc(UNIT.name)}</h2>
            <span class="unit-model-pill">${esc(UNIT.title)}</span>
            <span class="tag-chip">${esc(UNIT.name)}</span>
          </div>
          ${generalComp ? `
            <button type="button" class="fx-btn fx-btn-sm" onclick="openBlock('${generalComp.id}')">
              Характеристики установки →
            </button>
          ` : ''}
        </div>

        <!-- Большая схема приточной установки: блоки и их дочерние элементы (наименование, марка, тег) -->
        <div class="ahu-schematic-section">
          <div class="ahu-monoblocks-grid">
            ${monoBlocks.map(mb => `
              <div class="ahu-mono-frame">
                <div class="ahu-mono-head">
                  <button type="button" class="ahu-mono-btn" onclick="${mb.genId ? `openBlock('${mb.genId}')` : ''}">
                    <span>▤ ${esc(mb.name)}</span>
                  </button>
                </div>
                <div class="ahu-mono-cards">
                  ${mb.sections.map(node => renderFullBlockCard(node)).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // СОСТОЯНИЕ 2: Сжатая схема установки в верхней панели + строка/панель
    // каталога + карточки характеристик выбранного блока внизу
    // =========================================================================
    function renderBlockSelectedView(compId) {
      const c = compById(compId);
      if (!c) return '';
      const comps = allComponents();
      const byId = new Map(comps.map(x => [x.id, x]));
      const tree = buildSchematicTree();
      const generalComp = comps.find(x => x.itemCode === '__unit__');

      const ancestors = [];
      let cur = c.parentElementId ? byId.get(c.parentElementId) : null;
      while (cur) {
        ancestors.unshift(cur);
        cur = cur.parentElementId ? byId.get(cur.parentElementId) : null;
      }
      const activeRootBlock = ancestors.length ? ancestors[0] : c;
      const activeRootNode = tree.roots.find(r => r.item.id === activeRootBlock.id) || null;

      const monoBlocks = UNIT.monoblocks.filter(mb => mb.name !== '__unit__').map(mb => ({
        id: mb.id,
        shortName: mb.name.replace(/^Моноблок\s+/i, 'МБ '),
        sections: tree.roots.filter(r => r.item.monoId === mb.id)
      }));

      const notes = extractSectionNotes(c.specs);
      const rawGroups = (c.specs?.groups || []);
      const sortedGroups = prioritizeBlockGroups(rawGroups);
      const qNorm = state.blockSearch.trim().toLowerCase();
      const tag = firstTag(c);
      const { name, model } = splitNameAndModel(c);
      const catData = getCatalogDataForComp(c);

      const visibleGroups = sortedGroups
        .map(g => {
          const base = cleanParams(g.params);
          if (!qNorm) return { ...g, params: base };
          if (g.title.toLowerCase().includes(qNorm)) return { ...g, params: base };
          return {
            ...g,
            params: base.filter(p => String(p.key).toLowerCase().includes(qNorm) || String(p.value).toLowerCase().includes(qNorm))
          };
        })
        .filter(g => g.params.length > 0);

      return `
        <!-- 1. СЖАТАЯ СХЕМА УСТАНОВКИ В ВЕРХНЕЙ ПАНЕЛИ -->
        <div class="compact-unit-dock">
          <div class="compact-dock-row">
            <button type="button" class="compact-unit-home" onclick="selectUnit()" title="Вернуться к большой схеме установки">
              <span style="color:var(--flux-accent);">← Схема</span>
              <span>${esc(UNIT.name)}</span>
            </button>

            ${generalComp ? `
              <button
                type="button"
                class="compact-block-tile ${c.id === generalComp.id ? 'is-active' : ''}"
                style="border-color:var(--flux-line);"
                onclick="openBlock('${generalComp.id}')"
              >
                <span>❖ Установка</span>
              </button>
            ` : ''}

            ${monoBlocks.map(mb => `
              <div class="compact-mono-box">
                <span class="compact-mono-label">${esc(mb.shortName)}</span>
                ${mb.sections.map(node => {
                  const sec = node.item;
                  const isCurrentRoot = sec.id === activeRootBlock.id;
                  return `
                    <button
                      type="button"
                      class="compact-block-tile ${isCurrentRoot ? 'is-active' : ''}"
                      onclick="openBlock('${sec.id}')"
                    >
                      <span>${sectionIcon(sec)}</span>
                      <span class="c-pos">${esc(sec.itemCode)}</span>
                      <span class="c-name">${esc(shortBlockName(sec))}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `).join('')}
          </div>

          <!-- Переключение дочерних элементов внутри выбранного блока -->
          ${activeRootNode && activeRootNode.descendants.length > 0 ? `
            <div class="compact-subitems-bar">
              <span style="color:var(--flux-text-muted);font-weight:500;">Блок ${esc(activeRootBlock.itemCode)}:</span>
              <button
                type="button"
                class="compact-subitem-pill ${c.id === activeRootBlock.id ? 'is-selected' : ''}"
                onclick="openBlock('${activeRootBlock.id}')"
              >
                <span>${esc(shortBlockName(activeRootBlock))} (${esc(activeRootBlock.itemCode)})</span>
              </button>
              ${activeRootNode.descendants.map(({ item: sub }) => {
                const subTag = firstTag(sub);
                const subInfo = splitNameAndModel(sub);
                return `
                  <button
                    type="button"
                    class="compact-subitem-pill ${c.id === sub.id ? 'is-selected' : ''}"
                    onclick="openBlock('${sub.id}')"
                  >
                    <span>${esc(subInfo.name)}</span>
                    ${subTag ? `<span class="font-mono" style="font-size:10px;opacity:0.85;">${esc(subTag)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>

        <!-- 2. ШАПКА ВЫБРАННОГО ЭЛЕМЕНТА + СТРОКА И ПАНЕЛЬ ВЫБОРА ДАННЫХ ИЗ КАТАЛОГА -->
        <div class="block-header-box">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;">
              ${parseBlockPosition(c.itemCode) ? `<span class="fx-badge font-mono">Блок ${esc(c.itemCode)}</span>` : ''}
              <span class="fx-badge fx-badge-accent">${esc(c.role || c.equipType)}</span>
              <h3 style="font-size:15px;font-weight:600;color:var(--flux-text);">${esc(name)}</h3>
              ${model ? `<span class="fx-badge fx-badge-sky font-mono">${esc(model)}</span>` : ''}
              ${tag ? `<span class="tag-chip">${esc(tag)}</span>` : ''}
              <button type="button" class="tag-add-btn">+ тег</button>
              <button type="button" class="tag-add-btn">+ позиция внутрь</button>
            </div>

            <div style="display:flex;align-items:center;gap:4px;">
              <button type="button" class="fx-ibtn ${state.showAllParams ? 'is-on' : ''}" onclick="toggleShowAllParams()" title="${state.showAllParams ? 'Показывать по профилю' : 'Показать все параметры'}">👁</button>
              <button type="button" class="fx-ibtn" title="Сохранить вид">💾</button>
              <button type="button" class="fx-ibtn" title="История версий">🕓</button>
              <button type="button" class="fx-ibtn" title="Карточка связей">🔗</button>
            </div>
          </div>

          <!-- Строка выбора данных из каталога -->
          <div class="catalog-bar-inline">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:12px;font-weight:500;color:var(--flux-text-secondary);">Источник параметров:</span>
              <select class="catalog-select" onchange="setCatalogMode(this.value)">
                <option value="hybrid" ${state.catalogMode === 'hybrid' ? 'selected' : ''}>XML + заполнить пропуски из каталога</option>
                <option value="xml" ${state.catalogMode === 'xml' ? 'selected' : ''}>Только XML</option>
                <option value="catalog" ${state.catalogMode === 'catalog' ? 'selected' : ''}>Каталог</option>
              </select>
              ${state.catalogMode !== 'xml' ? `
                <span class="fx-badge font-mono">${esc(catData.matchedCode)}</span>
              ` : ''}
            </div>

            <div style="display:flex;align-items:center;gap:8px;">
              ${state.catalogMode !== 'xml' ? `
                <button type="button" class="fx-btn fx-btn-sm" onclick="toggleCatalogDrawer()">
                  ${state.catalogExpanded ? 'Скрыть каталог ▲' : 'Подобрать из каталога / Сравнить ▼'}
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Раскрываемая панель каталога -->
          ${state.catalogMode !== 'xml' && state.catalogExpanded ? `
            <div class="catalog-drawer">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <label class="search-box" style="flex:1;width:auto;">
                  <span style="color:var(--flux-text-muted);font-size:11px;">🔍</span>
                  <input placeholder="Марка, модель или производитель в каталоге…" />
                </label>
                <span style="font-size:11px;color:var(--flux-text-muted);">Совпадения · ${catData.matches.length}</span>
              </div>

              <div class="catalog-matches-list">
                ${catData.matches.map((m, idx) => `
                  <div class="catalog-match-row ${idx === 0 ? 'is-chosen' : ''}">
                    <div>
                      <span class="font-mono" style="font-weight:600;font-size:12px;">${esc(m.code)}</span>
                      <span style="font-size:12px;color:var(--flux-text-secondary);margin-left:6px;">${esc(m.title)}</span>
                    </div>
                    ${idx === 0 ? `<span class="fx-badge fx-badge-accent">✓ Выбрана</span>` : `<button type="button" class="fx-btn fx-btn-sm">Выбрать</button>`}
                  </div>
                `).join('')}
              </div>

              <table class="catalog-diff-table">
                <thead>
                  <tr>
                    <th>Характеристика</th>
                    <th>XML</th>
                    <th>Каталог</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${catData.diffs.map(d => {
                    const isAcc = !!state.catalogAccepted[`${c.id}||${d.group}||${d.key}`];
                    return `
                      <tr>
                        <td style="font-weight:500;">${esc(d.key)}</td>
                        <td class="font-mono" style="color:var(--flux-text-secondary);">${esc(d.xmlVal)}</td>
                        <td class="font-mono" style="color:var(--flux-sky);font-weight:600;">${esc(d.catVal)}</td>
                        <td style="text-align:right;">
                          ${isAcc
                            ? `<span class="fx-badge fx-badge-accent">✓ Принято</span>`
                            : `<button type="button" class="fx-btn fx-btn-sm fx-btn-primary" onclick="acceptCatalogDiff('${c.id}','${esc(d.group)}','${esc(d.key)}','${esc(d.catVal)}')">Принять</button>`
                          }
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}

          ${notes.length ? `
            <div class="notes-line">
              <span>⚠</span>
              <span>${esc(notes.join(' · '))}</span>
            </div>
          ` : ''}
        </div>

        <!-- 3. ХАРАКТЕРИСТИКИ ВЫБРАННОГО БЛОКА (многоколоночная сетка карточек) -->
        <div class="rp-content">
          <div class="specs-toolbar">
            <span style="font-size:13px;font-weight:600;">Характеристики · ${visibleGroups.reduce((a, g) => a + g.params.length, 0)}</span>
            <label class="search-box">
              <span style="color:var(--flux-text-muted);font-size:11px;">🔍</span>
              <input
                id="blockSearchInput"
                value="${esc(state.blockSearch)}"
                oninput="onBlockSearchInput(this.value)"
                placeholder="Фильтр параметров…"
              />
              ${state.blockSearch ? `<button type="button" class="fx-ibtn" onclick="onBlockSearchInput('')">✕</button>` : ''}
            </label>
          </div>

          ${visibleGroups.length === 0 ? `
            <div style="padding:24px;text-align:center;color:var(--flux-text-muted);font-size:12px;">У этого элемента нет дополнительных параметров.</div>
          ` : `
            <div class="groups-masonry-grid">
              ${visibleGroups.map(g => `
                <section class="group-card">
                  <div class="group-card-head">
                    <span>${esc(g.title)}</span>
                    <span class="fx-badge tabular-nums">${g.params.length}</span>
                  </div>
                  <div class="group-rows">
                    ${g.params.map(p => {
                      const token = `${c.id}||${g.title}||${p.key}`;
                      const isEdit = state.editingToken === token;
                      const isOver = state.overrides[token] !== undefined;
                      const isCat = !!state.catalogAccepted[token];
                      return `
                        <div class="kv-row">
                          <span class="kv-key">${esc(p.key)}</span>
                          ${isEdit ? `
                            <span class="kv-val-wrap">
                              <input id="editParamInput" style="width:130px;padding:1px 6px;border:1px solid var(--flux-accent);border-radius:4px;background:var(--flux-surface);font-size:12px;"
                                onkeydown="if(event.key==='Enter')saveEditParam('${c.id}','${esc(g.title)}','${esc(p.key)}');if(event.key==='Escape'){state.editingToken=null;renderRightPanel();}" />
                              <button type="button" class="fx-ibtn" style="color:var(--flux-accent);width:20px;height:20px;" onclick="saveEditParam('${c.id}','${esc(g.title)}','${esc(p.key)}')">✓</button>
                              <button type="button" class="fx-ibtn" style="width:20px;height:20px;" onclick="state.editingToken=null;renderRightPanel();">✕</button>
                            </span>
                          ` : `
                            <span class="kv-val-wrap">
                              <span class="kv-val ${isOver ? 'is-overridden' : ''} ${isCat ? 'is-catalog' : ''}">${esc(p.value)}${p.unit ? `<span class="kv-unit">${esc(p.unit)}</span>` : ''}</span>
                              ${isCat ? `<span class="fx-badge fx-badge-sky" style="font-size:10px;">Каталог</span>` : `
                                <button type="button" class="fx-ibtn" style="width:18px;height:18px;font-size:10px;" onclick="startEditParam('${esc(token)}', '${esc(p.value)}')" title="Изменить вручную">✎</button>
                              `}
                            </span>
                          `}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </section>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    renderTree();
    renderRightPanel();
  </script>
</body>
</html>
