# Сборка портативного Windows-exe (x64) на раннере GitHub и выкладка готового
# файла в GitHub Releases. В репозиторий exe не попадает — он весит ~125 МБ,
# и раньше каждая сборка добавляла эти мегабайты в историю ветки навсегда.
# Запуск: вручную (workflow_dispatch) или по метке [build-exe] в коммите.
name: Портативный EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/management-section-redesign-bjdxoh
      - claude/notebook-canvas-redesign-rhzsss
      - claude/program-code-review-ucf95m
      - claude/custom-table-builder-design-38h1b8
      - claude/hopeful-meitner-zb0ir5

# Повторные события одного ref оставляют только одну действующую сборку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-portable:
    # По push собираем только когда в сообщении коммита есть [build-exe] —
    # иначе каждый обычный коммит порождал бы новую сборку и новый выпуск
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-exe]') }}
    runs-on: windows-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости
        run: npm ci

      - name: Проверка подключения к общей базе данных
        run: |
          node --import tsx scripts/test-database-connection.ts
          node --import tsx scripts/test-database-client.ts
          node --import tsx scripts/test-process-mode.ts

      # Проверка настоящих NTFS, junction и ReplaceFileW до смены ABI SQLite
      # на Electron; весь файловый стенд создаётся в одноразовой папке TEMP.
      - name: Проверка проводника Windows и сохранения оригиналов
        run: node --import tsx scripts/test-windows-files.ts

      # Редакторы Flux Office — Документ, Таблица, PDF — из GenOffice по
      # закреплённому коммиту (tools/genoffice/build.mjs). До сборки фронтенда:
      # Vite кладёт public/ в dist, и окна редакторов едут в сборку с ним.
      # Их главные процессы и движок Excel (Rust, xlsx-sidecar.exe) — в
      # genoffice-server/, а он уходит в ресурсы программы (package.json).
      # Кэшируем только движок Rust. npm заново создаёт связи workspace:
      # восстановленные из архива Windows junction могут быть недоступны.
      - name: Кэш движка Excel
        uses: actions/cache@v4
        with:
          path: .cache/genoffice/apps/sheets/native/xlsx-engine/target
          key: genoffice-sidecar-${{ runner.os }}-${{ hashFiles('tools/genoffice/build.mjs', 'tools/genoffice/patches.mjs', 'tools/genoffice/inject/**', 'tools/genoffice/shims/**') }}

      # Движок Excel собирается cargo; на windows-latest Rust уже стоит
      - name: Rust
        run: rustup default stable

      - name: Редакторы Flux Office
        run: node tools/genoffice/build.mjs all

      - name: Сборка фронтенда и сервера
        run: npm run build

      - name: Проверка типов
        run: npm run lint

      - name: Сборка Electron
        run: npm run build:electron

      # На Windows-раннере better-sqlite3 пересобирается под ABI Electron самим
      # electron-builder (npmRebuild по умолчанию), поэтому prepare:win-native не нужен
      - name: Портативный exe (x64)
        run: npx electron-builder --win portable --x64

      - name: Имя файла и версия
        id: meta
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls release/*.exe | head -1)
          # Пробелы в имени мешают ссылке на файл выпуска — переименовываем
          OUT="release/Flux-$VERSION-x64.exe"
          mv "$SRC" "$OUT"
          echo "Собран: $OUT ($(du -h "$OUT" | cut -f1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          # Первый выпуск защиты ждёт открытые ключи с компьютера владельца.
          # Он не должен автоматически стать рекомендованным обновлением сотрудников.
          node -e "const fs=require('fs');const a=fs.readFileSync('license/ownerKey.ts','utf8');const b=fs.readFileSync('electron/updateKey.ts','utf8');const ready=['OWNER_PUBLIC_KEY_HEX','OWNER_BACKUP_PUBLIC_KEY_HEX','LICENSE_SIGNING_PUBLIC_KEY_HEX'].every(n=>new RegExp(n+' = \\'[a-f0-9]{64}\\'', 'i').test(a)) && /UPDATE_PUBLIC_KEY_HEX = '[a-f0-9]{64}'/i.test(b);fs.appendFileSync(process.env.GITHUB_OUTPUT,'prerelease='+!ready+'\\n');"

      - name: Целый exe как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: Flux-portable
          path: ${{ steps.meta.outputs.file }}
          retention-days: 30

      # Выпуск обновляется на месте: пересборка той же версии заменит файл,
      # а не создаст второй выпуск с тем же тегом
      - name: Выпуск в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Flux ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          body: |
            Портативная сборка Flux ${{ steps.meta.outputs.version }} для Windows x64.

            Скачайте `Flux-${{ steps.meta.outputs.version }}-x64.exe` и запустите —
            установка не требуется.

            - Flux 1.20.7 и Flux-Owner 1.2.3 работают вместе для выпуска обновлений; Owner автоматически подписывает публикации.
            - Каталог содержит 114 записей, 212 разделов и оригиналы PDF; сведения обновляются через предпросмотр, черновик и публикацию в БД без нового EXE.
            - Встроенный просмотр PDF показывает оригиналы внутри Flux; обычному читателю не нужно разбирать служебные сведения об источниках.
            - В переносе есть 167 кандидатов числовых таблиц; проверка ОСА охватила 155 строк, а три страницы требуют исправления кодировки.
            - Исправлены значки рабочего стола, импорт через Проводник Flux и геометрия окон; в оконном режиме скругление составляет 10 px и отключается при максимизации.
            - В Дурак можно собрать от двух до шести игроков; для Бильярда обязательны два места.
            - Owner показывает журналы с идентификаторами операций и очисткой чувствительных данных, а загрузки ограничены тайм-аутами.
            - Требуются Flux 1.20.7 и Flux-Owner 1.2.3; Windows portable, GUI и корпоративная NAS-сеть ещё не проверены.

            Собрано из коммита ${{ github.sha }} ветки `${{ github.ref_name }}`.
          files: ${{ steps.meta.outputs.file }}
          fail_on_unmatched_files: true
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}

  # Восстановление публикации готового EXE: только служебные правки после сборки.
  # Не компилирует продукт повторно и проверяет неизменность его исходников.
  publish-recovered:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-exe]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить исходники и сохранённый артефакт
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_HEAD: ceb3082563e84a60d3abde613cac7b03c5a8605b
          ARTIFACT_ID: '11331306785'
          ARTIFACT_SHA256: b9e6e1a69914ab6a12e626fecbc26b24acf5ab45ea0c725a7b7d0990f6d2d0f6
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.20.7'
          while IFS= read -r changed; do
            case "$changed" in
              scripts/run-remaining-api-fixture.ts|scripts/fixtures/remaining-live/remaining-live.mjs|scripts/fixtures/remaining-collaboration/seed-mail.mjs|scripts/test-windows-explorer-ui.ts|.github/workflows/build-owner.yml|.github/workflows/build-portable.yml|docs/testing/results-2026-10-05.md) ;;
              *) echo "Исходники продукта изменились: $changed. Требуется новая сборка." >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BUILT_HEAD" "$GITHUB_SHA")
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r '.workflow_run.head_sha' <<< "$artifact")" = "$BUILT_HEAD"
          test "$(jq -r '.name' <<< "$artifact")" = 'Flux-portable'
          test "$(jq -r '.expired' <<< "$artifact")" = 'false'
          test "$(jq -r '.digest' <<< "$artifact")" = "sha256:$ARTIFACT_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/flux-portable.zip"
          echo "$ARTIFACT_SHA256  $RUNNER_TEMP/flux-portable.zip" | sha256sum --check --status
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          filename = 'Flux-1.20.7-x64.exe'
          with zipfile.ZipFile(root / 'flux-portable.zip') as archive:
              names = archive.namelist()
              if len(names) != 1 or names[0] not in (filename, 'release/' + filename):
                  raise RuntimeError('Unexpected portable artifact contents')
              with archive.open(names[0]) as source, (root / filename).open('wb') as target:
                  shutil.copyfileobj(source, target)
          with (root / filename).open('rb') as executable:
              if executable.read(2) != b'MZ' or (root / filename).stat().st_size < 100_000_000:
                  raise RuntimeError('Invalid Windows portable executable')
          PY
          sha256sum "$RUNNER_TEMP/Flux-1.20.7-x64.exe" >> "$GITHUB_STEP_SUMMARY"
      - name: Опубликовать проверенный portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/flux-release-notes.md" <<'NOTES'
          Портативная сборка Flux 1.20.7 для Windows x64; установка не требуется.

          - Единый Проводник открывает зеркальные файлы Windows; импорт доступен через выбор файлов и Проводник.
          - Системные программы Flux убраны с рабочего стола, доступны через Пуск и панель задач.
          - Исправлены границы рабочего стола с учётом панели задач Windows и контур обычного окна.
          - Каталог содержит 114 записей и содержание 212 страниц с иллюстрациями и поиском, без служебных подписей источников.
          - Данные Каталога публикуются администратором через общую MariaDB, без замены программы.
          - Дурак поддерживает комнаты на 2–6 игроков; бильярд — на двух игроков, со зрителями отдельно.
          - Исправлены права общей почты и перенос в заметки; функции ИИ GenOffice удалены из Flux Office.
          - Обновления публикуются через Flux-Owner 1.2.3 с автоматической подписью и подробным безопасным журналом.

          Поместите Flux 1.20.7 и Flux-Owner 1.2.3 в одну папку; существующие ключи менять не нужно.
          Каталог: Управление данными → Публикации → предпросмотр, сохранение черновиков и публикация.
          Оригиналы сохранены целиком; числовые таблицы требуют сверки, три страницы — восстановления текста.
          Интерфейс на реальных мониторах Windows и корпоративная NAS здесь не проверялись.
          NOTES
          if gh release view v1.20.7 --repo "$GITHUB_REPOSITORY" --json targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            test "$(jq -r '.targetCommitish' "$RUNNER_TEMP/existing-release.json")" = "$GITHUB_SHA"
            gh release upload v1.20.7 "$RUNNER_TEMP/Flux-1.20.7-x64.exe" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.20.7 "$RUNNER_TEMP/Flux-1.20.7-x64.exe" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Flux 1.20.7' --notes-file "$RUNNER_TEMP/flux-release-notes.md" --latest
          fi
