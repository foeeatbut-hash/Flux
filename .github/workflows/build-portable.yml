# Сборка портативного Windows-exe (x64) на раннере GitHub и выкладка готового
# файла в GitHub Releases. В репозиторий exe не попадает — он весит ~125 МБ,
# и раньше каждая сборка добавляла эти мегабайты в историю ветки навсегда.
# Запуск: вручную (workflow_dispatch) или по метке [build-exe] в коммите.
name: Портативный EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/management-section-redesign-bjdxoh
      - claude/notebook-canvas-redesign-rhzsss
      - claude/program-code-review-ucf95m
      - claude/custom-table-builder-design-38h1b8

permissions:
  contents: write

jobs:
  build-portable:
    # По push собираем только когда в сообщении коммита есть [build-exe] —
    # иначе каждый обычный коммит порождал бы новую сборку и новый выпуск
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-exe]') }}
    runs-on: windows-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости
        run: npm ci

      # Редактор Документа Flux Office — из GenOffice по закреплённому коммиту
      # (tools/genoffice/build.mjs). До сборки фронтенда: Vite кладёт public/
      # в dist, и редактор едет в портативную сборку вместе с ним
      - name: Кэш исходников редактора
        uses: actions/cache@v4
        with:
          path: .cache/genoffice
          key: genoffice-${{ hashFiles('tools/genoffice/build.mjs') }}

      - name: Редактор Flux Office
        run: node tools/genoffice/build.mjs docs

      - name: Сборка фронтенда и сервера
        run: npm run build

      - name: Сборка Electron
        run: npm run build:electron

      # На Windows-раннере better-sqlite3 пересобирается под ABI Electron самим
      # electron-builder (npmRebuild по умолчанию), поэтому prepare:win-native не нужен
      - name: Портативный exe (x64)
        run: npx electron-builder --win portable --x64

      - name: Имя файла и версия
        id: meta
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls release/*.exe | head -1)
          # Пробелы в имени мешают ссылке на файл выпуска — переименовываем
          OUT="release/Flux-$VERSION-x64.exe"
          mv "$SRC" "$OUT"
          echo "Собран: $OUT ($(du -h "$OUT" | cut -f1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Целый exe как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: Flux-portable
          path: ${{ steps.meta.outputs.file }}
          retention-days: 30

      # Выпуск обновляется на месте: пересборка той же версии заменит файл,
      # а не создаст второй выпуск с тем же тегом
      - name: Выпуск в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Flux ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Портативная сборка Flux ${{ steps.meta.outputs.version }} для Windows x64.

            Скачайте `Flux-${{ steps.meta.outputs.version }}-x64.exe` и запустите —
            установка не требуется.

            Собрано из коммита ${{ github.sha }} ветки `${{ github.ref_name }}`.
          files: ${{ steps.meta.outputs.file }}
          fail_on_unmatched_files: true
          make_latest: true
