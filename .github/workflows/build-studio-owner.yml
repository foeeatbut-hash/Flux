# FluxStudio-Владелец.exe — сборка владельца. Только по ручному запуску
# (workflow_dispatch): в общие выпуски и в обновления разработчиков она не попадает,
# файл остаётся артефактом запуска с коротким сроком хранения. Закрытых ключей в
# сборке нет: хранилище ключей лежит на компьютере владельца (~/.flux-owner).
# Номер версии тот же, что у Flux и FluxStudio.exe, — из корневого package.json.
name: Flux Studio — Владелец (ручной запуск)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  owner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm ci --ignore-scripts
      - name: Проверки раздела владельца
        run: npm run test:studio-owner
      - name: Три пункта владельца: окно, пароль один раз, слова интерфейса
        run: |
          node --import tsx scripts/test-studio-owner-section.ts
          node --import tsx scripts/test-studio-words.ts
      - name: Пакет владельца
        run: npm run build:studio-owner
      # Настоящий запуск: пакет доходит до экрана входа, как у разработчика
      - name: Электрон для проверки запуска
        run: node node_modules/electron/install.js
      - name: Запуск собранной Studio — Владелец до экрана входа
        run: node --import tsx scripts/test-studio-electron-start.ts owner
      - name: Portable FluxStudio-Владелец.exe
        run: node studio/build.cjs owner --pack
      - name: Версия и файл
        id: meta
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          test -f "release-studio/FluxStudio-Владелец.exe"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Flux Studio — Владелец $VERSION: $(du -h "release-studio/FluxStudio-Владелец.exe" | cut -f1)"
      - name: Файл сборки (не выпуск)
        uses: actions/upload-artifact@v4
        with:
          name: FluxStudio-Владелец-${{ steps.meta.outputs.version }}
          path: release-studio/FluxStudio-Владелец.exe
          if-no-files-found: error
          retention-days: 7
