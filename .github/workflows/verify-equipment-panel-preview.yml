name: Equipment panel preview

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  equipment-panel-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.postgresql.prisma
          npx prisma generate --schema=prisma/schema.mariadb.prisma
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: Architecture constraints
        run: node --import tsx scripts/test-architecture.ts
      - name: Render actual Equipment screen and capture preview states
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: node scripts/fixtures/equipment-panel/check.mjs
      - name: Existing Equipment screen scenarios
        env:
          FLUX_CHROME: /usr/bin/google-chrome
          FLUX_FIXTURE_URL: http://127.0.0.1:4191
        run: |
          set -euo pipefail
          fixture_log="${{ runner.temp }}/equipment-ui-vite.log"
          node ./node_modules/vite/bin/vite.js --config scripts/fixtures/equipment-ui/vite.config.ts --host 127.0.0.1 --port 4191 --strictPort >"$fixture_log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$FLUX_FIXTURE_URL" --output /dev/null 2>/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then cat "$fixture_log"; exit 1; fi
            sleep 1
          done
          node scripts/fixtures/equipment-ui/check.mjs
      - name: Equipment catalog UI
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: node scripts/test-equipment-catalog-ui.mjs
      - name: Equipment XML and import UI scenarios
        env:
          FLUX_CHROME: /usr/bin/google-chrome
          FLUX_FIXTURE_URL: http://127.0.0.1:4192
        run: |
          set -euo pipefail
          fixture_log="${{ runner.temp }}/equipment-xml-source-vite.log"
          node ./node_modules/vite/bin/vite.js --config scripts/fixtures/equipment-xml-source-ui/vite.config.ts --host 127.0.0.1 --port 4192 --strictPort >"$fixture_log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$FLUX_FIXTURE_URL/importer.html" --output /dev/null 2>/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then cat "$fixture_log"; exit 1; fi
            sleep 1
          done
          node scripts/fixtures/equipment-xml-source-ui/check.mjs
          node scripts/fixtures/equipment-xml-source-ui/importer.check.mjs
      - name: Shared file chooser UI scenario
        env:
          FLUX_CHROME: /usr/bin/google-chrome
          FLUX_UI_URL: http://127.0.0.1:5173
        run: |
          set -euo pipefail
          vite_log="${{ runner.temp }}/flux-ui-vite.log"
          node ./node_modules/vite/bin/vite.js --config ./vite.config.ts --host 127.0.0.1 --port 5173 --strictPort >"$vite_log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$FLUX_UI_URL/scripts/fixtures/import-file-chooser.html" --output /dev/null 2>/dev/null; then break; fi
            if [[ "$attempt" == 60 ]]; then cat "$vite_log"; exit 1; fi
            sleep 1
          done
          node --import tsx scripts/test-import-file-chooser-ui.ts
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-panel-preview
          path: |
            /tmp/equipment-panel-*.png
            /tmp/flux-equipment-*.png
            /tmp/flux-equipment-ui-*.png
          if-no-files-found: warn
