name: Реестры действий и регрессии программ

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости и клиенты Prisma
        run: |
          npm ci
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.postgresql.prisma
          npx prisma generate --schema=prisma/schema.mariadb.prisma
      - name: Типы
        run: npm run lint
      - name: Архитектурные ограничения проекта
        run: node --import tsx scripts/test-architecture.ts
      - name: Guide, демонстрации, мессенджер и модель дополнения Office
        run: |
          set -euo pipefail
          for check in test-guide-parser test-guide-engine test-guide-store test-guide-tour-runtime test-chat-ux test-office-model test-office-bindings test-office-data test-office-template-store test-office-template-permissions test-office-template-mapping test-office-header-editor test-office-header-native test-office-sheets-collab-policy test-office-native-schema test-office-revisions test-office-cell-actions test-office-revision-recovery test-office-local test-office-reply-queue test-office-ui-contract; do
            node --import tsx "scripts/$check.ts"
          done
      - name: История Guide и F в одноразовом сервере SQLite
        run: node --import tsx scripts/test-guide-server.ts
      - name: Дополнение Office и сохранение файлов в одноразовом сервере SQLite
        run: |
          node --import tsx scripts/test-guide-server.ts --office-addon-api
          node --import tsx scripts/test-guide-server.ts --office-files
      - name: Все маршруты, управляющие элементы и паспорта
        run: npm run check:coverage -- --report "${{ runner.temp }}/flux-source-inventory.json"
      - name: Сам механизм проверок и новые регрессии
        run: npm run check:verification -- --report "${{ runner.temp }}/flux-infrastructure.json"
      - name: Регрессии оставшихся функций и запрет ИИ в Flux Office
        run: |
          set -euo pipefail
          node scripts/test-office-no-ai.cjs
          for check in test-entity-ids test-entity-id-migration-sqlite test-entity-id-migration-routes test-dynamic-field-rename-sqlite test-tag-exchange test-remaining-identity-project-routes test-remaining-files-notes test-remaining-files-explorer-purge test-html-to-markdown test-mail-open-unread; do
            node --import tsx "scripts/$check.ts"
          done
      - name: Компонентные сценарии интерфейса
        env:
          FLUX_CHROME: /usr/bin/google-chrome
          FLUX_UI_URL: http://127.0.0.1:5173
        run: |
          set -euo pipefail
          vite_log="${{ runner.temp }}/flux-ui-vite.log"
          DISABLE_HMR=true node ./node_modules/vite/bin/vite.js \
            --config ./vite.config.ts --host 127.0.0.1 --port 5173 --strictPort \
            >"$vite_log" 2>&1 &
          vite_pid=$!
          cleanup() {
            if kill -0 "$vite_pid" 2>/dev/null; then
              kill "$vite_pid" 2>/dev/null || true
              wait "$vite_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat "$vite_log"
              exit 1
            fi
            if curl --fail --silent --show-error \
              "$FLUX_UI_URL/scripts/fixtures/employee-import-ui.tsx" \
              --output /dev/null 2>/dev/null && \
              curl --fail --silent --show-error \
              "$FLUX_UI_URL/scripts/fixtures/icons-shell.html" \
              --output /dev/null 2>/dev/null && \
              curl --fail --silent --show-error \
              "$FLUX_UI_URL/scripts/fixtures/windows-explorer-ui.html?mix=1" \
              --output /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$vite_log"
            echo "Vite did not become ready at $FLUX_UI_URL" >&2
            exit 1
          fi

          for check in test-catalog-ui test-employee-import-ui test-windows-explorer-ui test-icons-shell-ui test-import-file-chooser-ui test-chat-ui test-chat-screen-ui test-owner-login-ui; do
            node --import tsx "scripts/$check.ts"
          done
          for check in test-remaining-identity-import-ui test-remaining-files-notes-ui test-remaining-engineering-registry-ui test-remaining-collaboration-handbook-ui test-remaining-shell-ui; do
            node --import tsx "scripts/$check.ts"
          done
      - name: Guide и демонстрации в узком и широком окне
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: |
          node --import tsx scripts/test-guide-ui.ts
          node --import tsx scripts/test-guide-spotlight-ui.ts
          node --import tsx scripts/test-office-addon-ui.ts
          node --import tsx scripts/test-office-cell-actions-ui.ts
      - name: Перенос ID в интерфейсе и локальные связи XML
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: node scripts/test-entity-id-migration-ui.mjs
      - name: Артефакты с явно указанной областью проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-verification-evidence
          path: |
            ${{ runner.temp }}/flux-source-inventory.json
            ${{ runner.temp }}/flux-infrastructure.json
            ${{ runner.temp }}/flux-ui-vite.log
            /tmp/catalog-ui-report.json
            /tmp/catalog-ui-*.png
            /tmp/employee-import-*.png
            /tmp/flux-desktop-*.png
            /tmp/flux-owner-login-ui/*
            /tmp/flux-explorer-shots/*.png
            /tmp/flux06-home-*.png
            /tmp/flux06-taskbar-*.png
          if-no-files-found: warn

  office-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm ci
      - name: Rust для движка Excel
        run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: .cache/genoffice/apps/sheets/native/xlsx-engine/target
          key: genoffice-sidecar-${{ runner.os }}-${{ hashFiles('tools/genoffice/build.mjs', 'tools/genoffice/patches.mjs', 'tools/genoffice/inject/**', 'tools/genoffice/shims/**') }}
      - name: Настоящие редакторы и приложение
        run: |
          node tools/genoffice/build.mjs all
          npm run build
          node scripts/test-office-no-ai.cjs
      - name: Заполнение Word и Excel в одноразовом проекте
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: |
          node --import tsx scripts/test-guide-server.ts --office-sheets-collab
          FLUX_NATIVE_ONLY=issued node --import tsx scripts/test-guide-server.ts --office-addon-native
          node --import tsx scripts/test-guide-server.ts --office-addon-native
      - name: Совместимость прежних режимов Word, Sheets и совместной правки
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: node --import tsx scripts/test-guide-server.ts --office-docs --office-sheets --office-collab
      - name: Демонстрации Guide в полном приложении
        env:
          FLUX_CHROME: /usr/bin/google-chrome
        run: node --import tsx scripts/test-guide-tours-native-live.ts
      - name: Снимки настоящих редакторов и демонстраций
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-native-office-guide-evidence
          path: |
            /tmp/office-addon-native-*.png
            /tmp/flux-office-native-errors.json
            /tmp/office-explorer-*.png
            /tmp/guide-tours-native-*.png
          if-no-files-found: warn
