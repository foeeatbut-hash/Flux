name: Flux-Owner portable

on:
  workflow_dispatch:
  push:
    branches: [main, claude/hopeful-meitner-zb0ir5]
    paths:
      - package.json
      - tools/flux-owner/**
      - .github/workflows/build-owner.yml

# Повторные события одного ref оставляют только одну действующую сборку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  portable:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-owner]') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/flux-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/flux-owner/package-lock.json

      - name: Зависимости
        run: npm ci
      - name: Проверки совместимости с Flux
        run: npm test
      - name: Windows portable
        run: npm run portable

      - name: Версии и имя файла
        id: meta
        shell: pwsh
        run: |
          $ownerVersion = node -p "require('./package.json').version"
          "tag=owner-v$ownerVersion" >> $env:GITHUB_OUTPUT
          "version=$ownerVersion" >> $env:GITHUB_OUTPUT
          "file=tools/flux-owner/release/Flux-Owner-$ownerVersion-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Owner-portable
          path: ${{ steps.meta.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Отдельный выпуск программы владельца
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          OWNER_VERSION: ${{ steps.meta.outputs.version }}
          OWNER_FILE: ${{ steps.meta.outputs.file }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            @'
          - Flux-Owner 1.2.3 совместим с Flux 1.20.7; поместите обе программы в одну папку.
          - Owner автоматически подписывает выпуск открытым хранилищем владельца.
          - Перед публикацией проверяются файл, подпись, размер и контрольная сумма.
          - Незавершённая загрузка не становится доступным обновлением; опубликованную версию нельзя подменить.
          - Подключение к существующей MariaDB и запуск серверной части через Flux сохраняются.
          - Журналы показывают этапы и идентификаторы операций и скрывают чувствительные данные.
          - Загрузка ограничена 10 минутами простоя и 20 минутами общего времени; готовность сервера после запуска ждут до 2 минут.
          - Требуются Flux 1.20.7 и Flux-Owner 1.2.3; вручную подписывать публикацию не нужно.
          '@ | Set-Content -Path owner-release-notes.md -Encoding utf8
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Flux-Owner $env:OWNER_VERSION" --notes-file owner-release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать выпуск Flux-Owner.' }
          }
          gh release upload $env:RELEASE_TAG "../../$env:OWNER_FILE" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось опубликовать portable Flux-Owner.' }
