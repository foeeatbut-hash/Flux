name: Проверка оболочки Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron/**
      - filesystem/**
      - tools/windows-notification-bridge/**
      - tools/e3-probe/**
      - scripts/test-e3-probe.ts
      - scripts/test-*windows*.ts
      - scripts/test-desktop-shell-native.ts
      - scripts/test-remaining-*.ts
      - verification/**
      - .github/workflows/verify-windows-shell.yml

permissions:
  contents: read

jobs:
  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Зависимости
        run: npm ci
      - name: Файловые права, конфликт сохранения и мост оболочки
        run: |
          $checks = @('test-windows-files', 'test-windows-files-bridge', 'test-displays-native', 'test-desktop-shell-native', 'test-windows-notifications', 'test-native-desktop-compile')
          foreach ($check in $checks) {
            node --import tsx "scripts/$check.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # Проводник «как в Windows 11» на настоящей NTFS: замена и занятый файл,
      # корзина, кириллица и путь длиннее 260 знаков, перенос между томами,
      # миниатюры, Быстрый доступ, меню Оболочки. Набор сам собирает и запускает
      # нативный помощник (C# через Add-Type). Чего на раннере нет (второго тома),
      # он называет SKIP и считает в итоге, а не засчитывает как успех.
      - name: Мост Проводника на настоящей NTFS и в Оболочке
        timeout-minutes: 15
        run: node --import tsx scripts/test-windows-files-native.ts
      # Скрипт проверки API E3 владелец запускает в Windows PowerShell 5.1 без E3 на раннере:
      # здесь разбирается синтаксис настоящим парсером 5.1, скрипт идёт на подставном COM,
      # собирается C# разборщика библиотек типов и снимается опись настоящего COM-объекта.
      - name: Скрипт проверки API E3 (PowerShell 5.1, подставной COM)
        timeout-minutes: 10
        run: node --import tsx scripts/test-e3-probe.ts
      - name: Компиляция компонента уведомлений и проверка MSIX
        shell: powershell
        run: tools/windows-notification-bridge/build.ps1 -OutputDirectory "$env:RUNNER_TEMP\flux-notifications"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-notification-bridge-unsigned
          path: ${{ runner.temp }}/flux-notifications/Flux.NotificationBridge.msix
