name: Проверка модулей Flux

on:
  push:
    branches: ['studio/**']
  pull_request:
    paths:
      - modules/**
      - electron/module*.ts
      - feedback/**
      - server/feedback/**
      - server/module*.ts
      - server/routes/module*.ts
      - prisma/**
      - src/feedback/**
      - src/components/feedback/**
      - src/services/module*.ts
      - verification/manifests/modules.json
      - electron/modules.ts
      - electron/main.ts
      - src/components/modules/**
      - src/screens/ModuleHost.tsx
      - src/services/moduleDataService.ts
      - src/lib/pageStateMemory.ts
      - scripts/test-modules-*.ts
      - scripts/fixtures/modules-*.ts*
      - scripts/fixtures/moduleLanguages.ts
      - scripts/fixtures/fakeCom.ts
      - scripts/fixtures/modules-conn-*
      - src/components/store/**
      - src/screens/StoreScreen.tsx
      - server/feedback/cleanup.ts
      - scripts/fixtures/wasmBuilder.ts
      - src/workers/moduleWasm.worker.ts
      - src/services/moduleCompute*.ts
      - src/services/moduleControlsGate.ts
      - verification/**
      - vite.config.ts
      - package*.json
      - .github/workflows/verify-modules.yml

permissions:
  contents: read

jobs:
  modules-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      FLUX_MODULE_SHOTS: artifacts/modules-shots
      # Живая проверка изоляции страницы (test-modules-page) и хостов методов (test-modules-ts-host, test-modules-programs-engines: TypeScript, Python, WebAssembly) идёт в настоящем Chrome; без него в CI она падает, а не пропускается
      FLUX_CHROME: C:\Program Files\Google\Chrome\Application\chrome.exe
      DISABLE_HMR: 'true'
      # Все наборы job обязательны: пропуск (нет сборки, Chromium) = провал, а не зелёный код (scripts/verifySkip.ts)
      FLUX_REQUIRE_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Сборка интерфейса и встроенного пакета
        run: npm run build
      - name: Типы и договор чтения
        shell: pwsh
        run: |
          node_modules/.bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @('modules-contract', 'modules-page', 'modules-openfile', 'modules-windows', 'modules-data', 'modules-limits', 'modules-runtime', 'modules-worker', 'modules-form', 'modules-refresh', 'modules-languages', 'modules-wasm', 'modules-python', 'modules-parity', 'modules-scheduler', 'modules-compute', 'modules-ts-host', 'modules-programs', 'modules-permissions', 'modules-programs-engines', 'modules-controls', 'modules-connections', 'modules-no-bundled', 'architecture')) {
            node --import tsx "scripts/test-$suite.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Набор modules-naming лежит в файле test-program-naming.ts (путь из манифеста проверок)
          node --import tsx scripts/test-program-naming.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Подписи, публикация, каналы и обращения на SQLite
        shell: pwsh
        run: |
          foreach ($suite in @('modules-trust', 'modules-publishing', 'modules-channels', 'modules-store', 'modules-promotion', 'modules-feedback', 'modules-journal')) {
            node --import tsx "scripts/test-$suite.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Сборка оболочки Electron
        run: npm run build:electron
      - name: Изоляция и живое обновление в Electron на Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node --import tsx scripts/test-modules-native.ts 2>&1 | Tee-Object artifacts/modules-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Страница программы в Electron на Windows (протокол, навигация, окна, сохранение, «не отвечает»)
        shell: pwsh
        run: |
          node --import tsx scripts/test-modules-page-native.ts 2>&1 | Tee-Object artifacts/modules-page-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python и WebAssembly в Electron на Windows
        shell: pwsh
        run: |
          node --import tsx scripts/test-modules-compute-native.ts 2>&1 | Tee-Object artifacts/modules-compute-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Подключения к внешним программам в Electron на Windows (HTTP, настоящий COM)
        shell: pwsh
        run: |
          node --import tsx scripts/test-modules-connections-native.ts 2>&1 | Tee-Object artifacts/modules-connections-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Пуск и карточки в полном Flux, обе темы
        shell: pwsh
        run: |
          node --import tsx scripts/test-modules-flux-ui-live.ts 2>&1 | Tee-Object artifacts/modules-flux-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modules-windows-evidence
          path: artifacts/
