name: Проверка панели черновиков
on:
  workflow_dispatch:
  push:
    branches: ['drafts/panel']
  pull_request:
    paths:
      - 'src/components/drafts/**'
      - 'src/store/draftsPanelStore.ts'
      - 'src/lib/drafts*'
      - 'electron/filesystem/**'
      - 'filesystem/contracts.ts'
      - 'scripts/*drafts*'
      - 'src/components/files/**'
      - 'src/store/drafts*'
      - 'scripts/fixtures/drafts*'
      - '.github/workflows/verify-drafts-panel.yml'
permissions:
  contents: read
jobs:
  drafts-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FLUX_UI_URL: http://127.0.0.1:5395
      FLUX_CHROME: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Сборки клиента и Electron
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
          exit $LASTEXITCODE
      - name: Типы и проверки шага
        run: |
          $env:NODE_OPTIONS='--max-old-space-size=8192'
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in @('test-drafts-desktop','test-drafts-source','test-drafts-store','test-drafts-view','test-drafts-actions','test-architecture','test-windows-files','test-windows-files-bridge','check-verification')) {
            node --import tsx "scripts/$check.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Неизменяемый интерфейсный стенд
        run: node --import tsx scripts/build-drafts-fixture.ts
      - name: Интерфейс и отрицательная мутация
        run: |
          $server=Start-Process node -ArgumentList 'scripts/serve-drafts-fixture.cjs' -PassThru
          try {
            node --import tsx scripts/test-drafts-panel-ui.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import tsx scripts/check-drafts-panel-mutation.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drafts-windows-evidence
          path: .cache/drafts-evidence
          if-no-files-found: ignore
