name: Проверка безопасности, MariaDB и PostgreSQL

on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/**
      - server.ts
      - catalog/**
      - equipment/**
      - feedback/**
      - src/components/catalog/**
      - src/components/builder/**
      - src/screens/CatalogScreen.tsx
      - src/screens/BuilderScreen.tsx
      - src/services/catalog*.ts
      - license/**
      - electron/**
      - shared/**
      - tools/flux-owner/**
      - src/config/env.ts
      - src/components/ConnectionPanel.tsx
      - scripts/test-*.ts
      - scripts/security-db-equipment-binding-ledger.ts
      - scripts/security-db-docflow-stage-2.ts
      - prisma/**
      - package.json
      - package-lock.json
      - .github/workflows/verify-security-db.yml

permissions:
  contents: read

jobs:
  security-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-fixture-password
          MARIADB_DATABASE: flux_update_fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-fixture-password
          POSTGRES_DB: flux_id_migration_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d flux_id_migration_fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm ci
      - name: Клиенты Prisma
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.mariadb.prisma
          npx prisma generate --schema=prisma/schema.postgresql.prisma
      - name: "Модули: публикация, Store и откаты на PostgreSQL и MariaDB"
        env:
          MODULES_PG_BASE: postgresql://postgres:disposable-ci-fixture-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          MODULES_MARIA_BASE: mysql://root:disposable-ci-fixture-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { Client } = require('pg');
          const mariadb = require('mariadb');
          (async () => {
            for (const provider of ['pg', 'maria']) {
              const base = new URL(process.env[provider === 'pg' ? 'MODULES_PG_BASE' : 'MODULES_MARIA_BASE']);
              const db = provider === 'pg'
                ? new Client({ connectionString: base.href })
                : await mariadb.createConnection({ host: base.hostname, port: Number(base.port), user: decodeURIComponent(base.username), password: decodeURIComponent(base.password) });
              if (provider === 'pg') await db.connect();
              try {
                for (const suite of ['publishing', 'channels', 'store']) {
                  const name = `flux_modules_${provider}_${suite}_fixture`;
                  await db.query(provider === 'pg' ? `CREATE DATABASE "${name}"` : `CREATE DATABASE \`${name}\``);
                  const fixture = new URL(base.href);
                  fixture.pathname = `/${name}`;
                  const env = { ...process.env };
                  delete env.FLUX_MODULES_PG_FIXTURE_URL;
                  delete env.FLUX_MODULES_MARIA_FIXTURE_URL;
                  env[provider === 'pg' ? 'FLUX_MODULES_PG_FIXTURE_URL' : 'FLUX_MODULES_MARIA_FIXTURE_URL'] = fixture.href;
                  console.log(`Проверка ${suite}: ${provider}`);
                  const result = spawnSync(process.execPath, ['--import', 'tsx', `scripts/test-modules-${suite}.ts`], { env, stdio: 'inherit' });
                  if (result.error) throw result.error;
                  if (result.status !== 0) throw new Error(`${suite}/${provider} завершился с кодом ${result.status} (${result.signal || 'без сигнала'})`);
                }
              } finally { await db.end(); }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Проверка типов
        run: npm run lint
      - name: Сессии, лицензии, подписи, упаковка и сохранность базы
        shell: bash
        run: |
          set -euo pipefail
          for check in test-auth-sessions test-owner-auth test-company-database test-client-session test-license-core test-license-revocation test-license-server test-update-signature test-update-download test-session-storage test-security test-review-auth test-review-auth-live test-portable-resources test-startup-database-bootstrap test-veza-xml test-entity-id-migration-sqlite; do
            node --import tsx "scripts/$check.ts"
          done
      - name: Перенос проектных ID на отдельных тестовых MariaDB и PostgreSQL
        env:
          FLUX_ID_MIGRATION_MARIA_FIXTURE_URL: mysql://root:disposable-ci-fixture-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/flux_id_migration_fixture
          FLUX_ID_MIGRATION_PG_FIXTURE_URL: postgresql://postgres:disposable-ci-fixture-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/flux_id_migration_fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const mariadb = require('mariadb');
          (async () => {
            const u = new URL(process.env.FLUX_ID_MIGRATION_MARIA_FIXTURE_URL);
            const db = await mariadb.createConnection({ host: u.hostname, port: Number(u.port), user: decodeURIComponent(u.username), password: decodeURIComponent(u.password) });
            try { await db.query('CREATE DATABASE `flux_id_migration_fixture`'); }
            finally { await db.end(); }
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
          FLUX_ID_MIGRATION_PROVIDER=mysql node --import tsx scripts/test-entity-id-migration-sqlite.ts
          FLUX_BINDING_LEDGER_PROVIDER=mysql node --import tsx scripts/security-db-equipment-binding-ledger.ts
          FLUX_ID_MIGRATION_PROVIDER=postgresql node --import tsx scripts/test-entity-id-migration-sqlite.ts
          FLUX_BINDING_LEDGER_PROVIDER=postgresql node --import tsx scripts/security-db-equipment-binding-ledger.ts
      - name: Документооборот — классы, комплекты и создание файлов на трёх СУБД
        env:
          FLUX_TEST_FIXTURE_DOCFLOW_STAGE2: "1"
          FLUX_DOCFLOW_MARIA_URL: mysql://root:disposable-ci-fixture-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/flux_docflow_stage2_fixture
          FLUX_DOCFLOW_PG_URL: postgresql://postgres:disposable-ci-fixture-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/flux_docflow_stage2_fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const mariadb = require('mariadb');
          const { Client } = require('pg');
          (async () => {
            const m = new URL(process.env.FLUX_DOCFLOW_MARIA_URL);
            const db = await mariadb.createConnection({ host: m.hostname, port: Number(m.port), user: decodeURIComponent(m.username), password: decodeURIComponent(m.password) });
            try { await db.query('CREATE DATABASE `flux_docflow_stage2_fixture`'); } finally { await db.end(); }
            const p = new URL(process.env.FLUX_DOCFLOW_PG_URL); p.pathname = '/postgres';
            const pg = new Client({ connectionString: p.toString() }); await pg.connect();
            try { await pg.query('CREATE DATABASE flux_docflow_stage2_fixture'); } finally { await pg.end(); }
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
          FLUX_DOCFLOW_STAGE2_PROVIDER=sqlite node --import tsx scripts/security-db-docflow-stage-2.ts
          FLUX_DOCFLOW_STAGE2_PROVIDER=mysql FLUX_DOCFLOW_STAGE2_FIXTURE_URL="$FLUX_DOCFLOW_MARIA_URL" node --import tsx scripts/security-db-docflow-stage-2.ts
          FLUX_DOCFLOW_STAGE2_PROVIDER=postgresql FLUX_DOCFLOW_STAGE2_FIXTURE_URL="$FLUX_DOCFLOW_PG_URL" node --import tsx scripts/security-db-docflow-stage-2.ts
      - name: Обновления через общую MariaDB 10.11
        env:
          FLUX_UPDATE_MARIA_FIXTURE_URL: mysql://root:disposable-ci-fixture-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/flux_update_fixture
        run: node --import tsx scripts/test-owner-updates.ts
      - name: Проверка границ скомпилированного API
        run: |
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs
          node --import tsx scripts/test-packaged-api-boundaries.ts
      - name: Каталог, независимые маркировки и проектные снимки
        shell: bash
        run: |
          set -euo pipefail
          for check in test-catalog-core test-catalog-review test-catalog-sources test-catalog-interaction-matrix test-catalog-import test-catalog-blank test-catalog-pack-veza2026 test-catalog-query test-catalog-seed-sql test-catalog-spreadsheet test-catalog-spreadsheet-routes test-equipment-catalog-sources test-equipment-catalog-family-sources test-builder-perms test-feedback-contracts; do
            node --import tsx "scripts/$check.ts"
          done
      - name: Публикации и права каталога через MariaDB 10.11
        env:
          FLUX_CATALOG_FIXTURE_BASE: mysql://root:disposable-ci-fixture-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/flux_catalog_fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const mariadb = require('mariadb');
          (async () => {
            const u = new URL(process.env.FLUX_CATALOG_FIXTURE_BASE);
            const db = await mariadb.createConnection({ host: u.hostname, port: Number(u.port), user: decodeURIComponent(u.username), password: decodeURIComponent(u.password) });
            try { for (const suffix of ['publication', 'http', 'review']) await db.query('CREATE DATABASE `flux_catalog_fixture_' + suffix + '`'); }
            finally { await db.end(); }
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
          FLUX_CATALOG_FIXTURE_URL="${FLUX_CATALOG_FIXTURE_BASE}_publication" node --import tsx scripts/test-catalog-publication.ts
          FLUX_CATALOG_FIXTURE_URL="${FLUX_CATALOG_FIXTURE_BASE}_http" node --import tsx scripts/test-catalog-workspace-http.ts
          FLUX_CATALOG_FIXTURE_URL="${FLUX_CATALOG_FIXTURE_BASE}_review" node --import tsx scripts/test-catalog-second-review-http.ts
      - name: Программа владельца
        run: npm test --prefix tools/flux-owner
